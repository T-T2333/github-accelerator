name: 仓库保活

on:
  schedule:
    # 每月 1 号 00:00 UTC 提交一次，保证仓库持续活跃。
    # GitHub 会在公开仓库连续 60 天无活动时自动停用定时工作流，
    # 每月一次的安全余量足以避免被停用。
    - cron: "0 0 1 * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: keepalive
  cancel-in-progress: false

jobs:
  keepalive:
    runs-on: ubuntu-latest
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 更新保活文件
        run: |
          mkdir -p .github
          LAST_COMMIT=$(git log -1 --format=%ct)
          NOW=$(date +%s)
          DAYS=$(( (NOW - LAST_COMMIT) / 86400 ))
          cat > .github/KEEPALIVE.md << EOF
          # Repository Keepalive

          This file is automatically updated to keep the repository active.

          **Last Update:** $(date -u +'%Y-%m-%d %H:%M:%S UTC')
          **Workflow Run:** #${{ github.run_number }}
          **Trigger:** ${{ github.event_name }}
          **Days Since Previous Commit:** ${DAYS}

          ---
          *Auto-generated by [保活 workflow](.github/workflows/keepalive.yml)*
          EOF

      - name: 提交并推送
        run: |
          set -uo pipefail
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add .github/KEEPALIVE.md
          if git diff --staged --quiet; then
            echo "无变化，跳过提交"
            exit 0
          fi
          git commit -m "chore: keepalive at $(date -u +'%Y-%m-%d')"
          for i in 1 2 3 4 5; do
            if git push; then
              echo "保活提交已推送"
              exit 0
            fi
            echo "::warning::推送失败，第 $i 次重试"
            sleep $((i * 10))
          done
          echo "::error::保活提交推送失败"
          exit 1
