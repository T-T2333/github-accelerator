name: Sync upstream mirrors

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-mirrors
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Sync mirror list from upstream
        id: sync
        run: |
          set -uo pipefail
          node scripts/sync-mirrors.mjs || echo "::warning::同步脚本执行失败，跳过本次同步"
          if git diff --quiet -- index.js mirrors.generated.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "上游无变化"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "检测到上游变化："
            git diff --stat -- index.js mirrors.generated.json
          fi

      - name: Probe mirror availability
        if: steps.sync.outputs.changed == 'true'
        continue-on-error: true
        run: node scripts/probe-mirrors.mjs > mirror-report.txt 2>&1 || true

      - name: Commit and push
        if: steps.sync.outputs.changed == 'true'
        run: |
          set -uo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.js mirrors.generated.json
          git commit -m "chore(mirrors): sync upstream accelerator list"
          for i in 1 2 3 4 5; do
            if git push; then
              echo "推送成功"
              break
            fi
            echo "::warning::推送失败，第 $i 次重试"
            sleep $((i * 10))
          done

      - name: Summary
        if: always()
        run: |
          {
            echo "### 加速源同步"
            echo ""
            if [ "${{ steps.sync.outputs.changed }}" = "true" ]; then
              echo "检测到上游变化，已提交到 main。"
            else
              echo "上游无变化，无需同步。"
            fi
            if [ -f mirror-report.txt ]; then
              echo ""
              echo "<details><summary>镜像可用性实测</summary>"
              echo ""
              echo '```'
              cat mirror-report.txt
              echo '```'
              echo "</details>"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
