name: Sync upstream mirrors

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: sync-mirrors
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Sync mirror list from upstream
        id: sync
        run: |
          set -uo pipefail
          node scripts/sync-mirrors.mjs || echo "::warning::同步脚本执行失败，将跳过本次同步"
          if git diff --quiet -- index.js mirrors.generated.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "上游无变化"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "检测到上游变化："
            git diff --stat -- index.js mirrors.generated.json
          fi

      - name: Probe mirror availability
        if: steps.sync.outputs.changed == 'true'
        continue-on-error: true
        run: node scripts/probe-mirrors.mjs > mirror-report.txt 2>&1 || true

      - name: Build pull request body
        if: steps.sync.outputs.changed == 'true'
        run: |
          {
            echo "自动同步 [XIU2/UserScript](https://github.com/XIU2/UserScript) 中"
            echo "\`GithubEnhanced-High-Speed-Download.user.js\` 的公益加速源列表。"
            echo ""
            echo "- 仅保留与宿主 \`\${加速源}/\${原始URL}\` 拼接格式兼容的条目"
            echo "- 跳过上游已用 \`//\` 注释掉的失效源"
            echo "- 过滤路径式镜像（如 \`https://x.com/github.com\`，拼接后必然失效）"
            echo "- 应用 \`mirrors.overrides.json\` 的 exclude / extra"
            echo ""
            echo "### 镜像可用性实测"
            echo ""
            echo '```'
            cat mirror-report.txt 2>/dev/null || echo "（未执行）"
            echo '```'
            echo ""
            echo "> 由 [sync-mirrors.yml](https://github.com/\${{ github.repository }}/blob/main/.github/workflows/sync-mirrors.yml) 自动创建，合并前请人工确认。"
          } > pr-body.md

      - name: Open sync pull request
        if: steps.sync.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          branch: chore/sync-mirrors
          base: main
          title: "chore: sync upstream mirror list"
          commit-message: "chore: sync upstream mirror list"
          body-file: pr-body.md
          labels: automated
          delete-branch: true

      - name: Summary
        run: |
          {
            echo "### 加速源同步"
            echo ""
            if [ "${{ steps.sync.outputs.changed }}" = "true" ]; then
              echo "检测到上游变化，已创建同步 PR。"
            else
              echo "上游无变化，无需同步。"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
